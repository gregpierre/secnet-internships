name: Test AI match text

# Manual only: Actions tab -> "Test AI match text" -> Run workflow.
# Analyzes one role against your resume and texts you the result.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id to analyze (blank = newest open role)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Analyze and text
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBERS: ${{ secrets.TWILIO_TO_NUMBERS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          JOB_ID: ${{ inputs.job_id }}
        run: python tools/sms_test.py $JOB_ID
