name: Test AI match

# Manual only: Actions tab -> "Test AI match" -> Run workflow.
# Analyzes one role against your resume and sends the result to Telegram
# (or, with "digest" ticked, sends today's top-matches list).
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id to analyze (blank = newest in-scope role)"
        required: false
        default: ""
      digest:
        description: "Send today's top-matches digest instead"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Analyze and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SEARCH: ${{ vars.GEMINI_SEARCH }}
          MATCH_MIN_SCORE: ${{ vars.MATCH_MIN_SCORE }}
          MATCH_CATEGORIES: ${{ vars.MATCH_CATEGORIES }}
          MATCH_TZ: ${{ vars.MATCH_TZ }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          JOB_ID: ${{ inputs.job_id }}
          DIGEST: ${{ inputs.digest }}
        run: |
          if [ "$DIGEST" = "true" ]; then
            python tools/match_test.py --digest
          else
            python tools/match_test.py "$JOB_ID"
          fi
